<!-- @dsCard group="Guardian" height=540 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>DurationChips — preview</title></head>
<body>
<div class="kx-stage">
  <div class="kx-specimen" style="width:340px;gap:var(--space-6)">
    <div class="kx-field"><span class="kx-field__label">How often</span>
      <div class="kx-seg" role="radiogroup" aria-label="How often" data-g="k"><button role="radio" aria-checked="false">Once</button><button role="radio" aria-checked="true">Daily</button></div></div>
    <div class="kx-field"><span class="kx-field__label">For how long</span>
      <div class="kx-chips" role="radiogroup" data-g="m"><button class="kx-chip" role="radio" aria-checked="false">15 min</button><button class="kx-chip" role="radio" aria-checked="false">30 min</button><button class="kx-chip" role="radio" aria-checked="false">1 hour</button><button class="kx-chip" role="radio" aria-checked="false">2 hours</button><button class="kx-chip" role="radio" aria-checked="true" data-c>Custom</button></div>
      <div id="mf" style="display:flex;flex-direction:column;gap:6px;margin-top:var(--space-2)"><div class="kx-field__box kx-field__box--error"><span style="flex:1">2000</span><span class="kx-small">minutes</span></div><span class="kx-field__msg kx-field__msg--error"><svg class="kx-ic kx-ic--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 11c-.55 0-1-.45-1-1V8c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1 4h-2v-2h2v2z"/></svg>Choose 1 to 1440 minutes.</span></div></div>
    <div class="kx-field"><span class="kx-field__label">For how many days</span>
      <div class="kx-chips" role="radiogroup" data-g="d"><button class="kx-chip" role="radio" aria-checked="false">3 days</button><button class="kx-chip" role="radio" aria-checked="true">7 days</button><button class="kx-chip" role="radio" aria-checked="false">14 days</button><button class="kx-chip" role="radio" aria-checked="false">30 days</button><button class="kx-chip" role="radio" aria-checked="false">Custom</button></div>
      <div class="kx-note-panel" style="margin-top:var(--space-2)"><svg class="kx-ic kx-ic--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 15c-.55 0-1-.45-1-1v-4c0-.55.45-1 1-1s1 .45 1 1v4c0 .55-.45 1-1 1zm1-8h-2V7h2v2z"/></svg><span>Today counts as day 1, including time already used. Need more time today? Choose Once.</span></div></div>
  </div>
</div>
<script>
document.querySelectorAll('[role=radiogroup]').forEach(function(g){g.querySelectorAll('button').forEach(function(c){c.onclick=function(){g.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-checked','false');});c.setAttribute('aria-checked','true');if(g.dataset.g==='m')document.getElementById('mf').style.display=c.hasAttribute('data-c')?'flex':'none';};});});
</script>
</body>
</html>
