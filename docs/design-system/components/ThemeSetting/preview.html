<!-- @dsCard group="Settings" height=470 width=860 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>ThemeSetting — preview</title></head>
<body>
<div class="kx-stage">
  <div style="display:flex;flex-direction:column;gap:var(--space-3);width:360px">
    <span class="kx-note">Where it lives · Home header</span>
    <div class="kx-phone" style="padding:var(--space-8) var(--space-5) var(--space-5)">
      <div style="display:flex;align-items:flex-start;justify-content:space-between">
        <div style="display:flex;flex-direction:column;gap:var(--space-2)"><span class="kx-eyebrow"><svg class="kx-ic" viewBox="36 22 36 66" aria-hidden="true" style="width:9px;height:16px"><path fill="currentColor" d="M38.5 47 C38.5 43.5 39.4 40.2 41 37.4 L42 26.5 C42.3 24.3 44.6 23.6 46 25.1 L51 32.4 C52 32.2 53 32.1 54 32.1 C55 32.1 56 32.2 57 32.4 L62 25.1 C63.4 23.6 65.7 24.3 66 26.5 L67 37.4 C68.6 40.2 69.5 43.5 69.5 47 C69.5 52.6 66.6 57.5 62.2 60.3 L66.5 81 A3.5 3.5 0 0 1 63 85 H45 A3.5 3.5 0 0 1 41.5 81 L45.8 60.3 C41.4 57.5 38.5 52.6 38.5 47 Z"/></svg>KRYPT</span><h1 class="kx-title">Your apps</h1></div>
        <button class="kx-iconbtn" aria-label="Appearance"><svg class="kx-ic" viewBox="0 0 24 24" aria-hidden="true"><g><rect fill="none" height="24" width="24"/></g><g><path d="M12,22c5.52,0,10-4.48,10-10S17.52,2,12,2S2,6.48,2,12S6.48,22,12,22z M13,4.07c3.94,0.49,7,3.85,7,7.93s-3.05,7.44-7,7.93 V4.07z"/></g></svg></button>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;gap:var(--space-3);width:400px">
    <span class="kx-note">Appearance sheet · System default is preselected</span>
    <div class="kx-sheet">
      <span class="kx-sheet__grab"></span>
      <h2 class="kx-headline">Appearance</h2>
      <div class="kx-themes" role="radiogroup" aria-label="Appearance">
        <button class="kx-theme" role="radio" aria-checked="true"><span class="kx-theme__pv kx-theme__pv--sys"><i></i><i></i></span><span class="kx-theme__name">System default</span><span class="kx-theme__sub">Matches your phone</span></button>
        <button class="kx-theme" role="radio" aria-checked="false"><span class="kx-theme__pv kx-theme__pv--light"><i></i></span><span class="kx-theme__name">Light</span><span class="kx-theme__sub">Always light</span></button>
        <button class="kx-theme" role="radio" aria-checked="false"><span class="kx-theme__pv kx-theme__pv--dark"><i></i></span><span class="kx-theme__name">Dark</span><span class="kx-theme__sub">Always dark</span></button>
      </div>
      <p class="kx-small">Applies to every Krypt screen, the lock screen included.</p>
    </div>
  </div>
</div>
<script>
var g=document.querySelector('.kx-themes');g.querySelectorAll('.kx-theme').forEach(function(b){b.onclick=function(){g.querySelectorAll('.kx-theme').forEach(function(x){x.setAttribute('aria-checked','false');});b.setAttribute('aria-checked','true');};});
</script>
</body>
</html>
