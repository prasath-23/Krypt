<!-- @dsCard group="Onboarding" height=330 -->
<!doctype html>
<html>
<head><meta charset="utf-8"><title>MandatoryProgress — preview</title></head>
<body>
<div class="kx-stage">
  <div class="kx-specimen" style="gap:var(--space-5)">
    <span class="kx-note">Counts only the 3 required</span>
    <div style="display:flex;flex-direction:column;gap:var(--space-2)"><div class="kx-ticks" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="0"><span class="kx-tick"></span><span class="kx-tick"></span><span class="kx-tick"></span></div><span class="kx-small">0 of 3 required</span></div>
    <div style="display:flex;flex-direction:column;gap:var(--space-2)"><div class="kx-ticks" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="2"><span class="kx-tick kx-tick--on"></span><span class="kx-tick kx-tick--on"></span><span class="kx-tick"></span></div><span class="kx-small">2 of 3 required</span></div>
    <div style="display:flex;flex-direction:column;gap:var(--space-2)"><div class="kx-ticks" role="progressbar" aria-valuemin="0" aria-valuemax="3" aria-valuenow="3"><span class="kx-tick kx-tick--on"></span><span class="kx-tick kx-tick--on"></span><span class="kx-tick kx-tick--on"></span></div><span class="kx-small" style="color:var(--granted)">3 of 3 required · ready</span></div>
  </div>
  <div class="kx-specimen" style="gap:var(--space-3)">
    <span class="kx-note">Bottom of the checklist</span>
    <button class="kx-btn kx-btn--primary kx-btn--block" disabled>Start protecting</button>
    <p class="kx-small" style="text-align:center">Allow the 3 required items to start.</p>
    <span class="kx-note" style="margin-top:var(--space-4)">When ready</span>
    <button class="kx-btn kx-btn--primary kx-btn--block">Start protecting</button>
  </div>
</div>
</body>
</html>
