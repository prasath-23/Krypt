<!doctype html>
<html>
<head><meta charset="utf-8"><title>Krypt — cover</title>
<style>
  html, body { margin: 0; height: 100%; background: var(--background); }
  .cv { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--background); }
  .cv svg { position: absolute; left: 480px; top: 0; width: 480px; height: 300px; }
  .ink { fill: var(--primary); }
  .hole { fill: var(--on-primary); }
  .whisk { stroke: var(--on-primary); fill: none; }
  .ring { fill: none; stroke: var(--on-surface-variant); stroke-width: 1px; }
  .tint { fill: var(--primary-container); }
  .open { fill: var(--open); }
  .txt { position: absolute; left: 48px; bottom: 44px; max-width: 440px; }
  .name { font-family: var(--font-serif); font-weight: 400; font-size: 120px; line-height: .92; letter-spacing: -2px; color: var(--on-surface); margin: 0; }
  .tag { font-family: var(--font-sans); font-size: 14px; line-height: 20px; color: var(--on-surface-variant); margin: 14px 0 0 4px; }
</style></head>
<body>
<div class="cv">
  <svg viewBox="0 0 480 300" aria-hidden="true">
    <!--
      blocks: primary slab 220×360 (radius-lg) bleeding off top and bottom · primary-container stadium 120×220 (radius-full) · open disc r12
      arrangement: one tall ink slab right of centre, a light-tint stadium to its left, nothing touching the name zone
      pattern: literal motif → the mark itself, a cat-eared keyhole with a keyhole cut in its leg, in on-primary on the slab at 3.4×
      steps/radii: gaps space-8 (32) and space-6 (24); slab radius-lg 22, stadium radius-full; hairline 1px
    -->
    <rect class="tint" x="96" y="56" width="120" height="220" rx="60"/>
    <rect class="ink" x="232" y="-30" width="220" height="360" rx="22"/>
    <g transform="translate(342 150) scale(3.4) translate(-54 -54)"><path class="hole" fill-rule="evenodd" d="M38.5 47 C38.5 43.5 39.4 40.2 41 37.4 L42 26.5 C42.3 24.3 44.6 23.6 46 25.1 L51 30.6 C52 30.4 53 30.3 54 30.3 C55 30.3 56 30.4 57 30.6 L62 25.1 C63.4 23.6 65.7 24.3 66 26.5 L67 37.4 C68.6 40.2 69.5 43.5 69.5 47 C69.5 52.6 66.6 57.5 62.2 60.3 L66.5 81 A3.5 3.5 0 0 1 63 85 H45 A3.5 3.5 0 0 1 41.5 81 L45.8 60.3 C41.4 57.5 38.5 52.6 38.5 47 Z M54 62 A4.8 4.8 0 0 1 56.6 70.8 L58.5 78.4 A1.7 1.7 0 0 1 56.85 80.5 H51.15 A1.7 1.7 0 0 1 49.5 78.4 L51.4 70.8 A4.8 4.8 0 0 1 54 62 Z"/></g>
    <rect class="ring" x="64" y="24" width="184" height="284" rx="92"/>
    <circle class="open" cx="156" cy="250" r="12"/>
  </svg>
  <div class="txt">
    <p class="name">Krypt</p>
    <p class="tag">Quiet, firm locks that only your Guardian can open.</p>
  </div>
</div>
</body>
</html>
