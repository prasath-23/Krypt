  /* Always dark, in both themes: the light theme's inverse-surface and inverse-on-surface, with the dark theme's open and caution. */
  .tl { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px 8px 12px; border-radius: var(--radius-full); background: #2e2e2e; color: #f2f2f2; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); font: 500 15px/18px var(--font-sans); white-space: nowrap; }

  .tl--ending .kx-ic { color: #f5a06a; }
  .tl__time { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  /* The top of a phone, with an app under the pill: one light, one dark. */
  .tl-app { position: relative; width: 300px; max-width: 100%; height: 200px; overflow: hidden; border: 1px solid var(--outline-variant); border-radius: var(--radius-xl); }
  .tl-app--light { background: #ffffff; color: #1f1f1f; }
  .tl-app--light .tl-skel i { background: #e3e3e3; } .tl-app--light .tl-skel b { background: #f0f0f0; }

  .tl-app--dark .tl-skel i { background: #2c2c2c; } .tl-app--dark .tl-skel b { background: #1f1f1f; }
  .tl-bar { height: 24px; padding: 0 20px; display: flex; align-items: center; font: 500 12px/16px var(--font-sans); }
  .tl-over { position: absolute; top: 32px; left: 0; right: 0; display: flex; justify-content: center; }
  .tl-skel { display: flex; flex-direction: column; gap: 12px; padding: 56px 20px 0; }
  .tl-skel i { display: block; height: 14px; border-radius: var(--radius-sm); }
  .tl-skel b { display: block; height: 72px; border-radius: var(--radius-lg); }
