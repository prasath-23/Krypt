#
# Krypt Gradle properties.
#

# Use AndroidX (not the legacy support libraries). Non-negotiable on modern Android.
android.useAndroidX=true

# Non-transitive R classes: each module gets only its own generated R class, not its
# dependencies' classes. Cuts APK size and speeds up incremental builds.
android.nonTransitiveRClass=true

# Kotlin official code style.
kotlin.code.style=official

# Gradle build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# 4 GB JVM heap for the Gradle daemon. Needed for Compose compiler + Hilt KAPT in
# the same build. Bump to 6g on a CI runner if memory is plentiful.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC

# Silence the deprecation warning from Kapt on Kotlin 2.0 (we still need it for Hilt
# until Hilt 2.53 ships KSP support). Revisit after Hilt 2.53+.
kapt.use.k2=false
